{% extends "base_public.html" %}
{% block titre %}Connexion{% endblock %}
{% block contenu %}
<h2>Connexion à votre compte</h2>
<p class="intro">Accédez à votre espace {{ nom_systeme }}</p>
<form method="post">
  <input type="hidden" name="jeton" value="{{ jeton() }}">
  <div class="champ"><label for="email">Adresse e-mail</label>
    <div class="champ-icone">{{ ico("courriel") }}<input type="email" id="email" name="email" placeholder="exemple@domaine.com" required autofocus></div></div>
  <div class="champ"><label for="mdp">Mot de passe</label>
    <div class="champ-icone">{{ ico("cadenas") }}<input type="password" id="mdp" name="mot_de_passe" placeholder="Entrez votre mot de passe" required>
      <button type="button" class="oeil" data-oeil="mdp" aria-label="Afficher le mot de passe">{{ ico("oeil") }}</button></div></div>
  <div class="ligne-options">
    <label class="se-souvenir"><input type="checkbox" name="souvenir" value="1"> Se souvenir de moi</label>
    <a href="{{ url_for('auth.mot_de_passe_oublie') }}">Mot de passe oublié ?</a>
  </div>
  <button class="btn btn-principal btn-large">Se connecter {{ ico("fleche") }}</button>
</form>
<p class="bascule">Vous n'avez pas de compte ? <a href="{{ url_for('auth.inscription') }}">Créer un compte</a></p>
{% endblock %}
