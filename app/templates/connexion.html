{% extends "base_public.html" %}
{% block titre %}Connexion{% endblock %}
{% block contenu %}
<h2>Connexion</h2>
<p class="intro">Identifiez-vous pour accéder à vos images et à vos analyses.</p>
<form method="post">
  <input type="hidden" name="jeton" value="{{ jeton() }}">
  <div class="champ"><label for="email">Adresse e-mail</label>
    <input type="email" id="email" name="email" required autofocus></div>
  <div class="champ"><label for="mdp">Mot de passe</label>
    <input type="password" id="mdp" name="mot_de_passe" required></div>
  <button class="btn btn-principal btn-large">Se connecter {{ ico("fleche") }}</button>
</form>
<p class="bascule">Pas encore de compte ? <a href="{{ url_for('auth.inscription') }}">Créer un compte</a></p>
{% endblock %}
