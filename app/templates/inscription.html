{% extends "base_public.html" %}
{% block titre %}Créer un compte{% endblock %}
{% block contenu %}
<h2>Créer un compte</h2>
<p class="intro">Chaque compte dispose de son propre espace d'images et d'analyses.</p>
<form method="post">
  <input type="hidden" name="jeton" value="{{ jeton() }}">
  <div class="champ"><label for="nom">Nom</label>
    <input id="nom" name="nom" required autofocus value="{{ request.form.get('nom', '') }}"></div>
  <div class="champ"><label for="email">Adresse e-mail</label>
    <input type="email" id="email" name="email" required value="{{ request.form.get('email', '') }}"></div>
  <div class="champ"><label for="mdp">Mot de passe</label>
    <input type="password" id="mdp" name="mot_de_passe" required minlength="8">
    <small>Au moins 8 caractères.</small></div>
  <div class="champ"><label for="conf">Confirmer le mot de passe</label>
    <input type="password" id="conf" name="confirmation" required></div>
  <button class="btn btn-principal btn-large">Créer le compte</button>
</form>
<p class="bascule">Déjà inscrit ? <a href="{{ url_for('auth.connexion') }}">Se connecter</a></p>
{% endblock %}
