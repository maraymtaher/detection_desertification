{# Sélecteur de thème, utilisable sur toutes les pages #}
{% macro choix_theme() %}
<div class="choix-theme" role="group" aria-label="Thème de l'interface">
  <button type="button" data-choix-theme="clair" onclick="choisirTheme('clair')" title="Thème clair">{{ ico("soleil") }}<span class="texte-menu"> Clair</span></button>
  <button type="button" data-choix-theme="sombre" onclick="choisirTheme('sombre')" title="Thème sombre">{{ ico("lune") }}<span class="texte-menu"> Sombre</span></button>
</div>
{% endmacro %}
